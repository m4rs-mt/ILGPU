name: Nudge

on:
  # Workflow is intentionally disabled on this PR branch. It will re-enable once the
  # branch merges onto master with the redesigned canonical CI pipeline that uses
  # the new ILGPUC.Tests suite. Use workflow_dispatch to trigger manually if needed.
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    environment: nudge
    if: (!github.event.repository.fork && !(github.event.workflow_run.name == 'Update Copyright Year' && github.event.workflow_run.event == 'push'))
    steps:
      - name: Send notification
        uses: pavlovic-ivan/octo-nudge@v3
        with:
          webhooks: ${{ secrets.NUDGE_WEBHOOKS }}